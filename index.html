<!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content= "width=device-width, initial-scale=1.0"> 
    </head>
    <body>
        <form>
            <input type="text" id="favouriteFilm" placeholder="Enter your favourite film">
        </form>
        <p id="displayInputValue"></p>
        <script>
            const inputValue = document.querySelector("#favouriteFilm")
            inputValue.addEventListener("input", function(e)
            {
                const displayInputValue = document.querySelector("#displayInputValue");
                displayInputValue.textContent = "You have entered: " + e.target.value;
                
            })
        </script>
    </body>
</html>
